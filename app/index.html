<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Local Voice</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Local Voice</h1>
    <p class="lead">Speech recognition that runs on this TV. Apps with a microphone button, such as YouTube, use it with no changes. Nothing you say leaves the TV.</p>
    <button id="toggle" disabled>Checking…</button>
    <p id="status" role="status"></p>
    <p class="note">Press the app's microphone button, wait for the Listening message, then speak.</p>
  </main>
  <script src="app.js"></script>
</body>
</html>
