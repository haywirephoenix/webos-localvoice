<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Local Voice</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Local Voice</h1>
    <p class="lead">Speech recognition that runs on this TV. Nothing you say leaves the TV.</p>
    <button id="toggle" disabled>Checking…</button>
    <p id="status" role="status"></p>
    <p>Try it here: hold the remote's microphone button, speak and let go.</p>
    <div id="meter"><i id="fill"></i><b id="mark"></b></div>
    <div id="test" class="empty">Your words appear here</div>
    <p class="note">It also works in other text boxes, in YouTube, and with an app's own microphone button.</p>
  </main>
  <script src="app.js"></script>
</body>
</html>
